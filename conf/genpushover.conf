
[genpushover]
# APP ID
# account
appid = abc123

# USER ID
#  acct
# To send notifications to more than one person, enter multiple Pushover
# user (or group) keys separated by spaces and/or commas, e.g.:
# userid = 123abc 456def 789ghi
userid = 123abc

# EXTRA USER ID (optional)
# A second, optional group of Pushover user (or group) keys, separated by
# spaces and/or commas, for recipients who should only receive a subset of
# notification categories (e.g. a family member who only wants outage
# alerts). Which categories this group receives is controlled by the
# extra_notify_error, extra_notify_warn, extra_notify_info,
# extra_notify_outage, extra_notify_sw_update and extra_notify_pi_state
# settings (all default to True; set the ones you don't want to False, or
# configure them from the Add On page in the Web UI). These recipients can
# only receive a category if it is also enabled above for the main
# "Notify for..." settings.
#extra_userid = 456def789012345678901234567890

# Notification sound
# Full list at https://pushover.net/api#sounds
pushsound = updown

# number of seconds to retry sending a failed message
max_retry_time = 600

# the number of seconds to wait before sending a failed message
default_wait = 120
