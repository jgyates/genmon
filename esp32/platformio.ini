; =============================================================================
; genmon-esp32 - PlatformIO project
; =============================================================================
;
; Two environments:
;   esp32dev  firmware for an ESP32-WROOM-32D DevKitC
;   native    host build that runs the unit tests in tests/ against src/core/
;
; Build and flash:   pio run -e esp32dev -t upload
; Run unit tests:    pio test -e native

[platformio]
default_envs = esp32dev
test_dir     = tests


; =============================================================================
; Shared settings
; =============================================================================

[common]
build_flags   = -std=gnu++17 -Wall
build_unflags = -std=gnu++11
lib_deps      = bblanchon/ArduinoJson@7.2.1


; =============================================================================
; Firmware
; =============================================================================

[env:esp32dev]
platform               = espressif32@6.9.0
board                  = esp32dev
framework              = arduino
monitor_speed          = 115200
; min_spiffs keeps two 1.9 MB app slots so the web OTA update can swap images,
; leaving a small LittleFS partition for the outage history.
board_build.partitions = min_spiffs.csv
board_build.filesystem = littlefs
build_flags            = ${common.build_flags}
build_unflags          = ${common.build_unflags}
lib_deps               = ${common.lib_deps}
                         knolleary/PubSubClient@2.8


; =============================================================================
; Host unit tests
; =============================================================================

[env:native]
platform         = native@1.2.1
build_flags      = ${common.build_flags}
                   -D UNITY_INCLUDE_DOUBLE
build_unflags    = ${common.build_unflags}
lib_deps         = ${common.lib_deps}
build_src_filter = +<core/>
test_build_src   = yes
