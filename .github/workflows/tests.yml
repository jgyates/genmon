# Runs the tests in tests/ on each Python version genmon supports (Raspberry Pi
# OS: 3.9 Bullseye, 3.11 Bookworm, 3.13 Trixie) for every push and pull request.
# Results are in the Actions tab and next to each commit and pull request.
#
# The simulator tests (tests/test_genmon_sim.py) run genmon against the
# anonymized register captures in tests/sim/captures.

name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:   # run by hand from the Actions tab

# the tests only read the code
permissions:
  contents: read

# a newer push to the same branch cancels the older run
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false   # finish the other versions when one fails
      matrix:
        python-version: ["3.9", "3.11", "3.13"]

    steps:
      # actions are pinned to a commit (a tag can be moved), with the version
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # uv provides every Python version on any Ubuntu (GitHub's setup-python
      # has no Python 3.9 for Ubuntu 26.04) and puts a virtual environment
      # with that version first on the PATH
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.9"
          python-version: ${{ matrix.python-version }}
          activate-environment: true
          enable-cache: true
          cache-dependency-glob: tests/requirements*.txt

      - name: Install the libraries the tests need
        run: uv pip install -r tests/requirements-sim.txt

      - name: Run the tests
        env:
          GENMON_CAPTURES: tests/sim/captures
        run: |
          python --version
          python -m unittest discover -s tests -v

  # checks the code for mistakes (unused or undefined names, shell script
  # errors), the same as tests/run_lint.sh
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.9"
          python-version: "3.13"

      - name: Lint
        run: bash tests/run_lint.sh
