[gensim]

# Settings for tests/sim/gensim.py, the generator simulator. tests/test_genmon_sim.py
# writes its own copy of this file for each test; this one is an example for
# running the simulator by hand:
#     python3 tests/sim/gensim.py tests/sim/

# Modbus address of the simulated controller, a hex number: typically 9d for
# Evolution / Nexus, 64 for H-100
address = 9d

# set to true to enable more debug output
debug = False

# The register file to simulate: a genmon register dump (.txt or .json). Full
# path, or a path relative to the folder gensim.py is started from.
# a register file can be captured with this command:
# http://192.168.1.10:8000/cmd/support_data_json
# save the file with a .json extension and use for the register_file input.
# Sanitized captures are located in the genmon/tests/sim/captures folder. 
# The captures files can be used for simulation also.
register_file =

# TCP port genmon connects to (genmon.conf: use_serial_tcp = True,
# serial_tcp_address = <this computer>, serial_tcp_port = <this port>)
server_socket = 9989

# Address to listen on: empty for every network interface, 127.0.0.1 for this
# computer only
bind_address = 127.0.0.1

# Folder for gensim.log
log_location = ./
